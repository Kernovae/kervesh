[package]
name = "kervesh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "kervesh"
description = "Native SSH, SFTP and remote monitoring workspace"

[dependencies]
anyhow.workspace = true
egui.workspace = true
tokio.workspace = true
serde_json.workspace = true
zeroize.workspace = true
chrono.workspace = true
regex.workspace = true
kervesh-core.workspace = true
kervesh-terminal.workspace = true
kervesh-ssh.workspace = true
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"

[features]
screenshot = ["eframe/__screenshot"]
